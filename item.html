<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23DFF75B'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='Arial Black'>T</text></svg>">
  <title>Item — ThreadForward</title>
</head>
<body>
<main>
  <section class="section">
    <div class="wrap">
      <p><a class="link" href="wardrobe.html">Back to the drop</a></p>
      <div id="item" style="margin-top:24px"><div class="item"><div class="gallery__main skeleton"></div><div></div></div></div>
    </div>
  </section>
</main>

<div class="modal" id="reqModal" role="dialog" aria-modal="true" aria-labelledby="reqTitle">
  <div class="modal__box">
    <button class="modal__close" aria-label="Close">✕</button>
    <div id="reqForm">
      <p class="kicker">Reserve this piece</p>
      <h2 class="display display--m" id="reqTitle" style="font-size:2rem;margin-bottom:20px">Where should we<br>hold it for you?</h2>
      <form class="form" novalidate>
        <div class="form-row">
          <div class="field"><label for="rName">Name</label><input id="rName" name="name" required maxlength="100" autocomplete="name"></div>
          <div class="field"><label for="rEmail">Email</label><input id="rEmail" name="email" type="email" required maxlength="200" autocomplete="email"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="rRole">I am</label>
            <select id="rRole" name="role"><option>Student</option><option>Working professional</option><option>Creative</option><option>Something else</option></select></div>
          <div class="field"><label for="rPickup">Pick-up</label>
            <select id="rPickup" name="pickup"><option>Weekday lunchtime</option><option>Weekday afternoon</option><option>Arrange by email</option></select></div>
        </div>
        <div class="field"><label for="rMsg">Anything we should know? <span class="hint">(optional)</span></label><textarea id="rMsg" name="message" maxlength="500"></textarea></div>
        <label class="check"><input type="checkbox" name="agree" required> I'll collect and pay within 7 days, or cancel so someone else can have it.</label>
        <p class="error-text" id="reqErr"></p>
        <button class="btn btn--ink" type="submit">Reserve it</button>
      </form>
    </div>
    <div id="reqDone" hidden class="success">
      <p class="kicker">Reserved</p>
      <h2 class="display display--m" style="font-size:2rem">It's yours to collect.</h2>
      <p>It's on hold for you for 7 days. We'll email pick-up details. Pay when you collect, and bring this passport ID:</p>
      <p class="mono" id="reqPid" style="font-size:1.1rem"></p>
      <a class="btn" href="wardrobe.html">Keep browsing</a>
    </div>
  </div>
</div>
<script type="module" src="item.js"></script>
</body>
</html>
