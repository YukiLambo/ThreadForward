<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23DFF75B'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='Arial Black'>T</text></svg>">
  <title>The Drop — ThreadForward</title>
</head>
<body>
<main>
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div>
          <p class="kicker">Checked, cleaned, ready to wear</p>
          <h1 class="display display--xl">The drop</h1>
        </div>
        <p class="lede muted">Every piece here passed our hygiene check and wears its own passport. Reserve it online, pay when you pick it up.</p>
      </div>

      <div class="filters" role="group" aria-label="Filter the rack">
        <div id="catChips" style="display:flex;flex-wrap:wrap;gap:10px"></div>
        <label class="sr-only" for="fSize">Size</label>
        <select id="fSize"><option value="">Any size</option></select>
        <label class="sr-only" for="fHub">Pick-up point</label>
        <select id="fHub"><option value="">Any pick-up point</option></select>
        <label class="check" style="margin:0 0 0 6px"><input type="checkbox" id="fClaimed"> Show rehomed</label>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px">
        <p class="muted" id="count" aria-live="polite" style="margin:0"></p>
        <div class="view-toggle" role="group" aria-label="View">
          <button type="button" data-view="rail" aria-pressed="true">Rail</button>
          <button type="button" data-view="grid" aria-pressed="false">Grid</button>
        </div>
      </div>
      <div id="railView" class="rail-wrap"></div>
      <div class="rack" id="rack" hidden></div>
    </div>
  </section>
</main>
<script type="module" src="wardrobe.js"></script>
</body>
</html>
