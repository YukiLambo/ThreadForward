<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23DFF75B'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='Arial Black'>T</text></svg>">
  <meta name="robots" content="noindex">
  <title>Team desk — ThreadForward</title>
</head>
<body>
<main>
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div>
          <p class="kicker">Team only</p>
          <h1 class="display display--l">Team desk</h1>
        </div>
        <div id="who"></div>
      </div>

      <div id="login" hidden>
        <div class="panel" style="max-width:460px">
          <h2 class="display display--m" style="font-size:1.8rem;margin-bottom:18px">Sign in</h2>
          <form class="form" id="loginForm">
            <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" required autocomplete="username"></div>
            <div class="field"><label for="aPw">Password</label><input id="aPw" type="password" required autocomplete="current-password"></div>
            <p class="error-text" id="loginErr" role="alert"></p>
            <button class="btn btn--ink" type="submit">Sign in</button>
          </form>
        </div>
      </div>

      <div id="desk" hidden>
        <div class="tabs" role="tablist">
          <button class="chip" data-tab="add" aria-pressed="true">+ Add a piece</button>
          <button class="chip" data-tab="rack" aria-pressed="false">On the rack</button>
          <button class="chip" data-tab="pending" aria-pressed="false">Donations to review <span id="nPending"></span></button>
          <button class="chip" data-tab="requests" aria-pressed="false">Requests</button>
          <button class="chip" data-tab="history" aria-pressed="false">Reviewed</button>
          <button class="chip" data-tab="workshops" aria-pressed="false">Workshop sign-ups</button>
          <button class="chip" data-tab="subscribers" aria-pressed="false">Newsletter</button>
        </div>
        <div id="panel"></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
