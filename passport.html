<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23DFF75B'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='Arial Black'>T</text></svg>">
  <title>Garment passport — ThreadForward</title>
</head>
<body>
<main>
  <section class="section">
    <div class="wrap split">
      <div>
        <p class="kicker">Garment passport</p>
        <h1 class="display display--xl">Every piece<br>has a <span class="serif">past.</span></h1>
        <p class="lede" style="margin-top:24px">Scan the QR on a ThreadForward tag, or type its passport ID, to see where it's been and the impact of wearing it again.</p>

        <form class="signup" id="lookup" style="margin-top:32px">
          <label class="sr-only" for="pid">Passport ID</label>
          <input id="pid" placeholder="TF-2026-HKBU-0842" autocomplete="off" spellcheck="false" style="font-family:var(--f-mono);text-transform:uppercase">
          <button type="submit">Look up</button>
        </form>
        <p style="margin-top:18px"><button class="btn btn--sm" id="scanBtn" type="button">Scan with camera</button></p>
        <div id="scanBox" hidden style="margin-top:18px">
          <div class="scanner"><video id="video" playsinline muted></video><div class="scanner__line"></div></div>
          <p class="muted" style="font-size:.9rem;margin-top:10px">Point your camera at the QR code. <button class="link" id="stopScan" type="button" style="background:none;border:0;cursor:pointer;padding:0">Stop</button></p>
        </div>
      </div>
      <div id="result" aria-live="polite">
        <div class="empty"><h3>No passport open</h3><p>Try <button class="link" id="sample" type="button" style="background:none;border:0;cursor:pointer;padding:0;font:inherit">a sample passport</button>.</p></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="passport.js"></script>
</body>
</html>
